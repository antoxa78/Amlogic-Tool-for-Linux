[package]
name = "aml-flash-tool"
version = "1.0.2"
edition = "2024"
description = "Amlogic USB Burning Tool GUI - Flash firmware to Amlogic Devices"
maintainer = "Anton"
copyright = "2026, Anton"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glib = "0.20"
chrono = "0.4"

[build-dependencies]
glib-build-tools = "0.20"

[package.metadata.deb]
assets = [
    ["target/release/aml-flash-tool", "usr/bin/", "755"],
    ["assets/aml-flash-tool.desktop", "usr/share/applications/", "644"],
    ["assets/aml-flash-tool.png", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["assets/99-amlogic-flash.rules", "lib/udev/rules.d/", "644"],
    # Bundled tools - shell scripts
    ["tools/aml_flash_tool.sh", "usr/lib/amlogicburn/tools/", "755"],
    ["tools/adnl_flash_tool.sh", "usr/lib/amlogicburn/tools/", "755"],
    ["tools/sdcard_burn_tool.sh", "usr/lib/amlogicburn/tools/", "755"],
    # Bundled tools - binaries (linux-x86)
    ["tools/linux-x86/update", "usr/lib/amlogicburn/tools/linux-x86/", "755"],
    ["tools/linux-x86/aml_image_v2_packer", "usr/lib/amlogicburn/tools/linux-x86/", "755"],
    ["tools/linux-x86/dnl_shim.so", "usr/lib/amlogicburn/tools/linux-x86/", "755"],
    ["tools/linux-x86/update_khadas", "usr/lib/amlogicburn/tools/linux-x86/", "755"],
    ["tools/linux-x86/aml_image_v2_packer_khadas", "usr/lib/amlogicburn/tools/linux-x86/", "755"],
    ["tools/linux-x86/aml_update.app", "usr/lib/amlogicburn/tools/linux-x86/", "755"],
    # Bundled tools - binaries (linux-arm)
    ["tools/linux-arm/update", "usr/lib/amlogicburn/tools/linux-arm/", "755"],
    ["tools/linux-arm/aml_image_v2_packer", "usr/lib/amlogicburn/tools/linux-arm/", "755"],
    # Bundled tools - ADNL
    ["tools/adnl/adnl", "usr/lib/amlogicburn/tools/adnl/", "755"],
    ["tools/adnl/adnl_burn_pkg", "usr/lib/amlogicburn/tools/adnl/", "755"],
    # ADNL usb_flow
    ["tools/adnl/usb_flow/AmlImagePack.so", "usr/lib/amlogicburn/tools/adnl/usb_flow/", "755"],
    ["tools/adnl/usb_flow/libaulextend.so", "usr/lib/amlogicburn/tools/adnl/usb_flow/", "755"],
    ["tools/adnl/usb_flow/libaml_usb_flow.so", "usr/lib/amlogicburn/tools/adnl/usb_flow/", "755"],
    ["tools/adnl/usb_flow/libamlfastboot.so", "usr/lib/amlogicburn/tools/adnl/usb_flow/", "755"],
    ["tools/adnl/usb_flow/liblua53.so", "usr/lib/amlogicburn/tools/adnl/usb_flow/", "755"],
    # Bundled tools - datas
    ["tools/datas/usbbl2runpara_ddrinit.bin", "usr/lib/amlogicburn/tools/datas/", "644"],
    ["tools/datas/usbbl2runpara_runfipimg.bin", "usr/lib/amlogicburn/tools/datas/", "644"],
    ["tools/datas/decompressPara_4M.dump", "usr/lib/amlogicburn/tools/datas/", "644"],
]
